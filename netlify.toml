[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# `publish` is resolved relative to `base` — do not repeat "frontend" here, or
# Netlify will look for frontend/frontend/dist, which does not exist.
#
# VITE_API_BASE_URL is set in the Netlify dashboard (Site settings > Environment
# variables), not here — it's a build-time value baked into the JS bundle, so any
# change to it requires a fresh build to actually take effect.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
